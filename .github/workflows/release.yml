name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version label used for generated artifacts (for example v2.5.7)
        required: true
        type: string
      publish:
        description: Publish the GitHub Release after validation succeeds
        required: true
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}

jobs:
  compression-parity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      # 推标签即发布，且没有确认环节。这条守卫让标签与配置版本不一致时在一分钟内停下，
      # 而不是等四十分钟的构建全跑完才在 release 作业里拒绝发版。
      # workflow_dispatch 是自检路线，标签名由 inputs.tag 随便挑，所以不受此守卫约束。
      - name: Refuse a tag that does not match the app version
        if: github.event_name == 'push'
        run: |
          CONFIG_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          CARGO_VERSION="$(awk -F'"' '/^version = /{print $2; exit}' src-tauri/Cargo.toml)"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "${RELEASE_TAG}" != "v${CONFIG_VERSION}" ]; then
            echo "✗ 标签 ${RELEASE_TAG} 与 src-tauri/tauri.conf.json 的 ${CONFIG_VERSION} 不一致" >&2
            echo "  要么先改版本号，要么删掉这个标签；推标签会立刻发布一个 Release" >&2
            exit 1
          fi
          # 三处版本号各写各的 = 发出去的包里混着上一个版本的元数据（0.3.6-rc.3 就是这么错的）。
          if [ "$CARGO_VERSION" != "$CONFIG_VERSION" ] || [ "$PKG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "✗ 版本串不一致：tauri.conf=$CONFIG_VERSION Cargo.toml=$CARGO_VERSION package.json=$PKG_VERSION" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Swift compression parity
        run: node tests/compression-parity.cjs

  # ═══ macOS ARM64 / Intel 分别构建，确保内置 CLI 与主程序架构一致 ═══
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install CLI tools
        # ffmpeg/ffprobe 是 Direct 视频轨的捆绑引擎，scripts/collect_macos_tools.sh 缺它会直接失败。
        # Homebrew 的 ffmpeg 带 GPL 编码器，对外分发前的对应源码义务仍未完成（见 THIRD_PARTY_NOTICES.md）。
        run: |
          brew install pngquant oxipng mozjpeg gifsicle webp jpeg-xl libavif ffmpeg
          bash scripts/collect_macos_tools.sh src-tauri/resources

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build
        working-directory: src-tauri
        env:
          CODE_SIGN_IDENTITY: ""
          # 没有独立更新私钥就按「更新禁用」构建，与 src-tauri/src/lib.rs 的 option_env! 门禁一致；
          # 公钥/端点只在 tauri.conf.updater.json 里，绝不回落到上游 OctoShrink 的密钥或 feed。
          SIZQO_UPDATER_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # --config 只接受一个值，所以资源清单和更新配置得先合成同一份 JSON。
          RESOURCES='{"bundle":{"resources":["resources/bin/*","resources/lib/*"]}}'
          if [ "${SIZQO_UPDATER_CONFIGURED}" = "1" ]; then
            jq -n --argjson r "$RESOURCES" --slurpfile u tauri.conf.updater.json '$r * $u[0]' \
              > "${RUNNER_TEMP}/ci.tauri.conf.json"
            CONFIG="${RUNNER_TEMP}/ci.tauri.conf.json"
          else
            CONFIG="$RESOURCES"
          fi
          cargo tauri build --target "${{ matrix.target }}" --bundles app --config "$CONFIG"

      - name: Bundle the video engine
        # src-tauri/src/video/process.rs 只在 <exe>/../Resources/video/bin 找 ffmpeg/ffprobe；
        # 上面的 bundle.resources 只覆盖图片 CLI，视频轨必须显式投递，否则应用内视频功能必然报缺引擎。
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Sizqo.app"
          SRC="src-tauri/resources/video"
          [ -d "$APP" ] || { echo "构建产物不存在：$APP" >&2; exit 1; }
          [ -d "$SRC/bin" ] || { echo "缺少视频引擎源：$SRC/bin" >&2; exit 1; }
          mkdir -p "$APP/Contents/Resources/video/bin" "$APP/Contents/Resources/video/lib"
          cp "$SRC/bin/"* "$APP/Contents/Resources/video/bin/"
          if compgen -G "$SRC/lib/*.dylib" >/dev/null; then
            cp "$SRC/lib/"*.dylib "$APP/Contents/Resources/video/lib/"
          fi
          chmod 755 "$APP/Contents/Resources/video/bin/"*
          echo "video/bin:"; ls -1 "$APP/Contents/Resources/video/bin"

      - name: Package app for signing
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Sizqo.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "src-tauri/target/${{ matrix.target }}/release/bundle/Sizqo_${{ matrix.arch }}.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-build
          path: src-tauri/target/${{ matrix.target }}/release/bundle/*.app.zip

  # ═══ macOS：合并 Universal 2，并自动完成 Developer ID 签名、公证与装订 ═══
  build-macos-universal:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-build
          path: artifacts/arm64

      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-build
          path: artifacts/x86_64

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_P12_BASE64:?Missing APPLE_DEVELOPER_ID_P12_BASE64 secret}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing APPLE_DEVELOPER_ID_P12_PASSWORD secret}"

          KEYCHAIN_PATH="${RUNNER_TEMP}/sizqo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="${RUNNER_TEMP}/developer-id.p12"

          printf '%s' "${DEVELOPER_ID_P12_BASE64}" | base64 -D > "${P12_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security import "${P12_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
            | grep 'Developer ID Application: Guofeng Liu (U8U443D7ZL)'

          cp /usr/bin/true "${RUNNER_TEMP}/developer-id-signing-test"
          codesign --force --options runtime --timestamp \
            --sign 'Developer ID Application: Guofeng Liu (U8U443D7ZL)' \
            "${RUNNER_TEMP}/developer-id-signing-test"
          codesign --verify --strict "${RUNNER_TEMP}/developer-id-signing-test"

          echo "SIGNING_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Merge Universal app
        run: |
          mkdir -p work/arm64 work/x86_64 work/universal release
          ditto -x -k artifacts/arm64/Sizqo_arm64.app.zip work/arm64
          ditto -x -k artifacts/x86_64/Sizqo_x86_64.app.zip work/x86_64
          bash scripts/merge_macos_universal.sh \
            work/arm64/Sizqo.app \
            work/x86_64/Sizqo.app \
            work/universal/Sizqo.app

      - name: Sign, notarize, and staple macOS assets
        env:
          # 公证优先走 App Store Connect API key（本机实测唯一可用的非交互路线），
          # 没有这组 Secret 才回落到 Apple ID + App 专用密码。
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGNING_IDENTITY: 'Developer ID Application: Guofeng Liu (U8U443D7ZL)'
        run: |
          bash scripts/sign_notarize_macos_ci.sh \
            work/arm64/Sizqo.app \
            work/x86_64/Sizqo.app \
            work/universal/Sizqo.app \
            release

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Sign updater archive
        run: |
          set -euo pipefail
          ARCHIVE="release/Sizqo_${RELEASE_TAG}_macos_universal.app.tar.gz"
          [ -f "$ARCHIVE" ] || { echo "缺少更新包：$ARCHIVE" >&2; exit 1; }
          # 没有独立更新私钥就中止：Release 里缺 latest.json 会让已装客户端的检查永久 404，
          # 而带着空签名发布更糟。宁可不出版。
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || {
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY：无法签名在线更新包，本轮发布中止" >&2
            exit 1
          }
          cargo tauri signer sign "$ARCHIVE"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-build
          path: release/*

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -e "${SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "${SIGNING_KEYCHAIN}"
          fi

  # App Store 不随 GitHub Release 分发，但每次发布必须验证独立 feature 线。
  verify-appstore:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check App Store feature line
        working-directory: src-tauri
        env:
          CARGO_PROFILE_RELEASE_PANIC: unwind
        run: cargo check --no-default-features --features appstore

  # ═══ Windows 构建 ═══
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Strip pre-release suffix from bundle version (MSI requires numeric-only)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.version -match '-') {
            $numeric = ($conf.version -split '-')[0]
            $conf.version = $numeric
            $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8
            Write-Host "MSI 版本只能是数字：bundle 版本改为 $numeric（tag 仍是 $env:RELEASE_TAG）"
          }

      - name: Download CLI tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path src-tauri\resources\bin | Out-Null
          Remove-Item src-tauri\resources\bin\* -Force -ErrorAction SilentlyContinue

          function Download-Tool($name, $url, $pattern) {
            try {
              $zip = "$name.zip"
              Write-Host "Downloading $name from $url"
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $dest = "extract-$name"
              Expand-Archive $zip -DestinationPath $dest -Force
              $found = Get-ChildItem -Path $dest -Filter $pattern -Recurse | Select-Object -First 1
              if ($found) {
                Copy-Item $found.FullName "src-tauri\resources\bin\$name" -Force
                Write-Host "  OK $name"
              } else {
                Write-Host "  SKIP $name - binary not found in archive"
              }
              Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "  SKIP $name - $($_.Exception.Message)"
            }
          }

          Download-Tool "pngquant.exe" "https://pngquant.org/pngquant-windows.zip" "pngquant.exe"
          Download-Tool "oxipng.exe" "https://github.com/shssoichiro/oxipng/releases/download/v9.1.5/oxipng-9.1.5-x86_64-pc-windows-msvc.zip" "oxipng.exe"
          Download-Tool "gifsicle.exe" "https://eternallybored.org/misc/gifsicle/releases/1.95/windows-x64/gifsicle-x64.zip" "gifsicle.exe"
          Download-Tool "cwebp.exe" "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.4.0-windows-x64.zip" "cwebp.exe"
          Download-Tool "avifenc.exe" "https://github.com/AOM-AV1/libavif/releases/download/v1.1.1/libavif-win64-v1.1.1.zip" "avifenc.exe"
          Download-Tool "cjxl.exe" "https://github.com/libjxl/libjxl/releases/download/v0.10.2/jxl-x64-windows-0.10.2.zip" "cjxl.exe"
          Download-Tool "cjpeg.exe" "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.2/libjpeg-turbo-3.0.2-vc64.exe" "cjpeg.exe"

          # cjpeg from libjpeg-turbo installer might be an EXE installer, try alternative
          if (-not (Test-Path "src-tauri\resources\bin\cjpeg.exe")) {
            Download-Tool "cjpeg.exe" "https://github.com/Mozreble/mozjpeg/releases/download/v4.1.1/mozjpeg-4.1.1-win64.zip" "cjpeg.exe"
          }

          Write-Host "`nBundled tools:"
          Get-ChildItem src-tauri\resources\bin\ -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Add resources config and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.PSObject.Properties.Name -contains 'resources') {
            $config.bundle.resources = @("resources/bin/*")
          } else {
            $config.bundle | Add-Member -NotePropertyName "resources" -NoteValue @("resources/bin/*")
          }
          $config | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ═══ Linux 构建 ═══
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Strip pre-release suffix from bundle version (RPM forbids dashes)
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          case "$VERSION" in
            *-*)
              NUMERIC="${VERSION%%-*}"
              jq --arg v "$NUMERIC" '.version = $v' src-tauri/tauri.conf.json > /tmp/conf.json
              mv /tmp/conf.json src-tauri/tauri.conf.json
              echo "RPM 版本不允许 '-'：bundle 版本改为 $NUMERIC（tag 仍是 $RELEASE_TAG）"
              ;;
          esac

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            file \
            squashfs-tools

      - name: Download CLI tools
        run: |
          set +e
          rm -f src-tauri/resources/bin/*
          rm -rf src-tauri/resources/lib/

          # Install via apt
          sudo apt-get install -y pngquant gifsicle webp libavif-bin libjpeg-turbo-progs || true
          for tool in pngquant gifsicle cwebp avifenc cjpeg; do
            p=$(which $tool 2>/dev/null)
            if [ -n "$p" ] && [ -f "$p" ]; then
              cp "$p" src-tauri/resources/bin/ && echo "  OK $tool" || echo "  SKIP $tool"
            else
              echo "  SKIP $tool (not found)"
            fi
          done

          # oxipng
          wget -q "https://github.com/shssoichiro/oxipng/releases/download/v9.1.5/oxipng-9.1.5-x86_64-unknown-linux-musl.tar.gz" -O /tmp/oxipng.tar.gz && \
            tar xzf /tmp/oxipng.tar.gz -C /tmp && \
            cp /tmp/oxipng-*/oxipng src-tauri/resources/bin/ && echo "  OK oxipng" || echo "  SKIP oxipng"

          # cjxl
          wget -q "https://github.com/libjxl/libjxl/releases/download/v0.10.2/jxl-linux-x64-static-v0.10.2.tar.gz" -O /tmp/jxl.tar.gz && \
            mkdir -p /tmp/jxl-extract && \
            tar xzf /tmp/jxl.tar.gz -C /tmp/jxl-extract 2>/dev/null && \
            find /tmp/jxl-extract -name cjxl -type f -executable -exec cp {} src-tauri/resources/bin/ \; 2>/dev/null && \
            echo "  OK cjxl" || echo "  SKIP cjxl"

          echo ""
          echo "Bundled tools:"
          ls -la src-tauri/resources/bin/

      - name: Add resources config and build
        run: |
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json', 'r') as f:
              d = json.load(f)
          d['bundle']['resources'] = ['resources/bin/*']
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
              f.write('\n')
          "

          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri build

      - name: Repair AppImage launcher permissions
        run: |
          set -euo pipefail
          APPIMAGE_PATH="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE_PATH"
          python3 scripts/repair_appimage_permissions.py "$APPIMAGE_PATH"

          EXTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "$EXTRACT_DIR"' EXIT
          (
            cd "$EXTRACT_DIR"
            APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$APPIMAGE_PATH" --appimage-extract
          )
          test -x "$EXTRACT_DIR/squashfs-root/AppRun"
          if [ -e "$EXTRACT_DIR/squashfs-root/AppRun.wrapped" ]; then
            test -x "$EXTRACT_DIR/squashfs-root/AppRun.wrapped"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ═══ 发布 Release ═══
  release:
    needs: [compression-parity, build-macos, build-macos-universal, verify-appstore, build-windows, build-linux]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        id: kind
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name "*.dmg" -exec cp {} release/ \;
          find artifacts -name "*.exe" -exec cp {} release/ \;
          find artifacts -name "*.msi" -exec cp {} release/ \;
          find artifacts -name "*.deb" -exec cp {} release/ \;
          find artifacts -name "*.AppImage" -exec cp {} release/ \;
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find artifacts -name "*.sig" -exec cp {} release/ \;
          VERSION="${RELEASE_TAG#v}"
          # 带 '-' 的标签就是预发布（vX.Y.Z-rc.N）。它绝不能变成 "latest"，
          # 也不能生成 latest.json —— 那等于把在线更新源指向一个门禁还没齐的构建。
          case "${RELEASE_TAG}" in
            *-*) PREVIEW=true ;;
            *)   PREVIEW=false ;;
          esac
          echo "preview=${PREVIEW}" >> "${GITHUB_OUTPUT}"
          if [ "${PREVIEW}" = true ]; then
            echo "预发布 ${RELEASE_TAG}：不产出 latest.json，应用内更新源保持指向上一个正式版"
          else
            ARCHIVE="Sizqo_${RELEASE_TAG}_macos_universal.app.tar.gz"
            SIGNATURE="$(cat "release/${ARCHIVE}.sig")"
            DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ARCHIVE}"
            jq -n \
              --arg version "$VERSION" \
              --arg notes "Sizqo ${VERSION}" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg signature "$SIGNATURE" \
              --arg url "$DOWNLOAD_URL" \
              '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"darwin-aarch64":{signature:$signature,url:$url},"darwin-x86_64":{signature:$signature,url:$url}}}' \
              > release/latest.json
          fi
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sizqo ${{ env.RELEASE_TAG }}
          body: |
            ## Sizqo ${{ env.RELEASE_TAG }}

            本机媒体压缩工具，图片与视频都只在本地处理，不上传服务器。

            ### 下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS Universal 2 | `Sizqo_${{ env.RELEASE_TAG }}_macos_universal.dmg` | 推荐，一个包同时带 Apple Silicon 与 Intel 切片 |
            | macOS Apple Silicon | `Sizqo_${{ env.RELEASE_TAG }}_macos_arm64.dmg` | M 系列芯片专用，真机验收过 |
            | macOS Intel | `Sizqo_${{ env.RELEASE_TAG }}_macos_x86_64.dmg` | 已签名公证，但尚无人在 Intel 真机上完成验收 |
            | Windows | `.exe` / `.msi` | 内置压缩工具 |
            | Linux | `.deb` / `.AppImage` | 内置压缩工具 |

            macOS 资产均经 Developer ID 签名、Apple 公证与装订；`latest.json` 是应用内更新源，
            仅在本轮配置了独立更新签名时产出。

            ### 能力
            - 图片：PNG、JPEG、GIF、WebP、AVIF、JPEG XL 压缩与格式转换
            - macOS 支持系统 JPEG、PNG、HEIF 转换、尺寸调整和元数据保留
            - 视频：Direct 轨捆绑 FFmpeg，可编码能力由运行时探测决定；不支持的轨道、HDR/高位深等在选择时即拒绝并解释
            - 意图优先双栏工作台：选意图而不是裸参数，队列、详情与结果同屏
            - 图片与文件夹批量导入，支持追加、去重、排序和失败重试
            - 支持覆盖原图、添加文件名后缀或输出到指定文件夹；覆盖前备份原图
            - 压缩历史、原图恢复与备份保留设置
            - 可暂停、继续或停止当前一轮；未开始的项留在队列中
            - 独立窗口对比压缩前后效果
            - 可调整 CPU 并行上限，支持自动、亮色和暗色外观
          files: release/*
          fail_on_unmatched_files: true
          draft: false
          # 预发布标签（vX.Y.Z-rc.N）标成 pre-release 且不抢 "latest"：
          # 验收矩阵/许可/公证链路没跑完之前，正式版才是用户默认拿到的那一个。
          prerelease: ${{ steps.kind.outputs.preview == 'true' }}
          make_latest: ${{ steps.kind.outputs.preview != 'true' }}
