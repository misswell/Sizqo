name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev file
      - name: cargo test (default)
        working-directory: src-tauri
        run: cargo test --lib
      - name: crash injection (SIGKILL × 6 phases + idempotent re-recovery)
        working-directory: src-tauri
        # --nocapture：崩溃注入的逐阶段结论就是这条门禁的证据，
        # 静默通过的 harness 在 CI 日志里和"没跑"看不出区别。
        run: cargo test --test crash_injection -- --nocapture
      - name: contract vectors (Rust side)
        working-directory: src-tauri
        run: cargo test --lib rust_executes_every_contract -- --nocapture
      - name: real media matrix (--ignored 真实编码，需要真的 FFmpeg 引擎)
        working-directory: src-tauri
        # 上一轮这一步 0 passed / 2 failed，panic 是 "Exec format error (os error 8)"：
        # 仓库里提交的 resources/video/bin 是 macOS arm64 Mach-O，Linux 上按存在性命中
        # 之后交给 Command 必然炸。binfmt 闸门把这类候选跳掉之后，这里装一个系统 ELF
        # 引擎，让这条门禁真的在 Linux 上跑一次真实编码，而不是把测试挪走。
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx264
          ffmpeg -hide_banner -encoders | grep -q libx265
          cargo test --lib real -- --ignored

  # macOS 才成立的行为（ImageIO 系统转换等）以前只被 swift-checks 间接碰到，
  # 没有任何作业真的在 macOS 上跑 cargo test —— 平台分支的断言因此无人守。
  rust-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --lib (default)
        working-directory: src-tauri
        run: cargo test --lib
      - name: cargo test --lib --features inproc-backends
        working-directory: src-tauri
        run: cargo test --lib --features inproc-backends
      - name: crash injection on macOS (APFS 上的真实 SIGKILL 现场)
        working-directory: src-tauri
        run: cargo test --test crash_injection -- --nocapture

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm run test:frontend (29 suites incl. virtualization + perf benchmark)
        run: npm run test:frontend

  swift-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift history/backup/scheduler self-checks + contract vectors
        run: bash scripts/test_swift_history.sh

  # §28 审查修复（P0-3）：`cargo check` 只能证明 Windows 分支编得过，证明不了
  # 目录 fsync 真跑得通（读句柄上 sync_all 会直接失败）。这一段要的是运行时结论。
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (Windows 编译)
        working-directory: src-tauri
        run: cargo check --lib
      - name: cargo test --lib (Windows 运行时：目录 fsync / 隔离改名 / 句柄占用)
        working-directory: src-tauri
        run: cargo test --lib
      - name: contract vectors (Windows side)
        working-directory: src-tauri
        run: cargo test --lib rust_executes_every_contract -- --nocapture
      - name: real media matrix (--ignored 真实编码，Windows 侧)
        working-directory: src-tauri
        shell: pwsh
        # 这一格以前只有 cargo check / cargo test --lib / 契约向量三步，也就是
        # "Windows 编译通过"一直在替"Windows 视频轨可用"背书 —— P0-3 批评的正是这种
        # 拿编译当运行的读法。仓库里的内置引擎是 Mach-O，PE 那半从来不存在，所以
        # 与 Linux 同一处置：装一个本机跑得动的引擎，让真实编码真的在 Windows 上跑一次。
        # 跑不动就让它红，红也是读数。
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            # choco 写的是机器 PATH，同一 job 的后续步骤未必重新读到；显式追加两个已知落点。
            foreach ($d in @("$env:ProgramData\chocolatey\bin", "C:\ffmpeg\bin")) {
              if (Test-Path $d) { $d | Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Append }
            }
            $env:Path = "C:\ffmpeg\bin;$env:ProgramData\chocolatey\bin;$env:Path"
          }
          $engine = (Get-Command ffmpeg).Source
          Write-Host "engine: $engine"
          # 顺带证一件事：PATH 上这条候选确实被格式门判成"本机可执行"（PE 头），
          # 不是靠"存在就算"混进来的 —— 解析失败时 tool() 的报错会指名 PE/切片。
          if (-not (Test-Path $engine)) { throw "ffmpeg 解析结果不存在：$engine" }
          & $engine -hide_banner -encoders > $env:TEMP\enc.txt
          foreach ($codec in @("libx264", "libx265")) {
            if (-not (Select-String -Path $env:TEMP\enc.txt -Pattern $codec -Quiet)) {
              throw "引擎缺少 $codec，真实矩阵无法验收"
            }
          }
          cargo test --lib real -- --ignored

  appstore-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev file
      - name: cargo test --no-default-features --features inproc-backends
        working-directory: src-tauri
        run: cargo test --no-default-features --features inproc-backends
